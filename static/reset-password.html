<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Your Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
    
        :root {
          --primary: #4361ee;
          --primary-dark: #3a56d4;
          --success: #2ec4b6;
          --bg-light: #f8f9fa;
          --text: #2b2d42;
          --text-light: #6c757d;
          --white: #ffffff;
          --shadow: 0 10px 30px rgba(67, 97, 238, 0.15);
        }
    
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }
    
        body {
          font-family: 'Poppins', sans-serif;
          background: var(--bg-light);
          color: var(--text);
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
          padding: 20px;
        }
    
        .container {
          background: var(--white);
          padding: 3rem;
          border-radius: 16px;
          box-shadow: var(--shadow);
          max-width: 480px;
          width: 100%;
          animation: fadeIn 0.6s ease-out;
        }
    
        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(20px); }
          to { opacity: 1; transform: translateY(0); }
        }
    
        h1 {
          color: var(--text);
          font-weight: 600;
          font-size: 1.8rem;
          margin-bottom: 1.5rem;
          text-align: center;
        }
    
        label {
          display: block;
          font-weight: 500;
          margin-top: 1rem;
          color: var(--text);
        }
    
        input {
          width: 100%;
          padding: 10px;
          margin-top: 0.5rem;
          border: 1px solid #ccc;
          border-radius: 4px;
          font-size: 1rem;
        }
    
        .guidance-message {
          font-size: 0.85rem;
          color: var(--text-light);
          margin-top: 5px;
        }
    
        .error-message {
          font-size: 0.85rem;
          color: #f44336;
          margin-top: 5px;
          display: none;
        }
    
        button {
          width: 100%;
          padding: 12px;
          background: var(--primary);
          color: var(--white);
          border: none;
          border-radius: 8px;
          font-weight: 500;
          cursor: pointer;
          transition: all 0.3s ease;
          margin-top: 1.5rem;
          font-size: 1rem;
        }
    
        button:hover {
          background: var(--primary-dark);
          transform: translateY(-2px);
          box-shadow: 0 6px 12px rgba(67, 97, 238, 0.2);
        }
    
        @media (max-width: 576px) {
          .container {
            padding: 2rem;
          }
          
          h1 {
            font-size: 1.5rem;
          }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>パスワードをリセットしてください</h2>
        <form id="reset-form">
            <input type="hidden" id="token" name="token">
            <input type="hidden" id="user" name="user">
            <label for="new_password">新しいパスワード</label>
            <input type="password" id="new_password" name="new_password" required>
            <div class="guidance-message">
                * パスワードは8文字以上で、大文字、小文字、数字を含める必要があります
            </div>
            <label for="confirm_new_password">パスワードの確認</label>
            <input type="password" id="confirm_new_password" name="confirm_new_password" required>
            <div id="password-error" class="error-message">パスワードが一致しないか、条件を満たしていません</div>
            <button type="submit">パスワードをリセット</button>
        </form>
        <div id="message"></div>
    </div>
    <script>
        // Set hidden token and user inputs from URL parameters
        const params = new URLSearchParams(window.location.search);
        document.getElementById('token').value = params.get('token');
        document.getElementById('user').value = params.get('user');
        
        // Regex for legal password: at least 8 characters, one uppercase, one lowercase and one number.
        const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[A-Za-z\d]{8,}$/;
        
        function validatePasswords() {
          const password = document.getElementById('new_password').value;
          const confirmPassword = document.getElementById('confirm_new_password').value;
          const errorElement = document.getElementById('password-error');
          
          const legalPassword = passwordRegex.test(password);
          const passwordsMatch = password === confirmPassword;
          
          if (!legalPassword) {
            errorElement.textContent = "パスワードは8文字以上で、大文字、小文字、数字を含める必要があります";
            errorElement.style.display = 'block';
            return false;
          } else if (confirmPassword && !passwordsMatch) {
            errorElement.textContent = "パスワードが一致しません";
            errorElement.style.display = 'block';
            return false;
          } else {
            errorElement.style.display = 'none';
            return true;
          }
        }
        
        // Validate on password and confirm password input
        document.getElementById('new_password').addEventListener('input', validatePasswords);
        document.getElementById('confirm_new_password').addEventListener('input', validatePasswords);
        
        document.getElementById('reset-form').addEventListener('submit', async (e) => {
          e.preventDefault();
          
            if (!validatePasswords()) {
            alert("パスワードが条件を満たしていません。");
            return;
            }
            
            const token = document.getElementById('token').value;
            const user = document.getElementById('user').value;
            const new_password = document.getElementById('new_password').value;
            
            const response = await fetch('/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, user, new_password })
            });
            
            const result = await response.json();
            if (result.message === "Success") {
            window.location.href = "reset-success.html";
            } else {
            document.getElementById('message').textContent = result.message || "Something went wrong.";
            }
        });
    </script>
</body>
</html>
