<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Success!</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        
        :root {
            --primary: #4361ee;
            --primary-dark: #3a56d4;
            --success: #2ec4b6;
            --bg-light: #f8f9fa;
            --text: #2b2d42;
            --text-light: #6c757d;
            --white: #ffffff;
            --shadow: 0 10px 30px rgba(67, 97, 238, 0.15);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-light);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            background: var(--white);
            padding: 3rem;
            border-radius: 16px;
            box-shadow: var(--shadow);
            text-align: center;
            max-width: 480px;
            width: 100%;
            animation: fadeIn 0.6s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .icon-container {
            margin-bottom: 1.5rem;
        }
        
        .success-icon {
            background: rgba(46, 196, 182, 0.1);
            color: var(--success);
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        
        h1 {
            color: var(--text);
            font-weight: 600;
            font-size: 1.8rem;
            margin-bottom: 1rem;
        }
        
        p {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text-light);
            margin-bottom: 2rem;
        }
        
        .btn {
            display: inline-block;
            padding: 12px 32px;
            background: var(--primary);
            color: var(--white);
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(67, 97, 238, 0.15);
        }
        
        .btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(67, 97, 238, 0.2);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .footer {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: var(--text-light);
        }
        
        @media (max-width: 576px) {
            .container {
                padding: 2rem;
            }
            
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-container">
            <div class="success-icon">
                <i class="fas fa-check"></i>
            </div>
        </div>
        <h1>Password Reset Complete!</h1>
        <p>Your password has been successfully reset. You can now log in to your account with your new password.</p>
        <a href="/login.html" class="btn">
            Go to Login <i class="fas fa-arrow-right" style="margin-left: 8px;"></i>
        </a>
    </div>
</body>
</html>
