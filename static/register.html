<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        :root {
        --primary: #4361ee;
        --primary-dark: #3a56d4;
        --bg-light: #f8f9fa;
        --text: #2b2d42;
        --text-light: #6c757d;
        --white: #ffffff;
        --shadow: 0 10px 30px rgba(67, 97, 238, 0.15);
        }

        * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        }

        body {
        font-family: 'Poppins', sans-serif;
        background: var(--bg-light);
        color: var(--text);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
        }

        .container {
        background: var(--white);
        padding: 3rem;
        border-radius: 16px;
        box-shadow: var(--shadow);
        max-width: 480px;
        width: 100%;
        animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
        }

        h1 {
        color: var(--text);
        font-weight: 600;
        font-size: 1.8rem;
        margin-bottom: 1.5rem;
        text-align: center;
        }

        .form-group {
        margin-bottom: 1rem;
        text-align: left;
        }

        .form-group label {
        display: block;
        font-weight: 500;
        margin-bottom: 0.5rem;
        color: var(--text);
        }

        .form-group input,
        .form-group select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 1rem;
        }

        .form-group input:focus,
        .form-group select:focus {
        outline: none;
        border-color: var(--primary);
        }

        .guidance-message {
        font-size: 0.85rem;
        color: var(--text-light);
        margin-top: 5px;
        }

        .error-message {
        font-size: 0.85rem;
        color: #f44336;
        margin-top: 5px;
        display: none;
        }
          .show-password {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            font-size: 13px;
        }

        .show-password input {
            width: auto; 
            margin: 0;
            vertical-align: middle;
        }

        .show-password label {
            white-space: nowrap;
            vertical-align: middle;
            margin: 0;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1.5rem;
            font-size: 1rem;
        }

        button:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(67, 97, 238, 0.2);
        }

        p {
            margin-top: 1rem;
            font-size: 1rem;
            text-align: center;
            color: var(--text-light);
        }

        p a {
            color: var(--primary);
            text-decoration: none;
        }

        p a:hover {
            text-decoration: underline;
        }

        @media (max-width: 576px) {
            .container {
            padding: 2rem;
            }

            h1 {
            font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>アカウントを作成</h2>
        <form id="registerForm">
            <div class="form-group">
                <label for="last_name">姓:</label>
                <input type="text" id="last_name" name="last_name" required>
            </div>
            <div class="form-group">
                <label for="first_name">名:</label>
                <input type="text" id="first_name" required></input>
            </div>
            <div class="form-group">
                <label for="dob">生年月日:</label>
                <input type="date" id="dob" name="dob" required>
            </div>
            <div class="form-group">
                <label for="country">国:</label>
                <select id="country" name="country" required>
                  <option value="">国を選択する</option>
                </select>
            </div>
            <div class="form-group">
                <label for="address">住所:</label>
                <input type="text" id="address" name="address" required>
            </div>
            <div class="form-group">
                <label for="gender">性別:</label>
                <select id="gender" name="gender" required>
                  <option value="">選択する</option>
                  <option value="female">女性</option>
                  <option value="male">男性</option>
                  <option value="other">秘密</option>
                </select>
            </div>
            <div class="form-group">
                <label for="username">ユーザー名:</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label for="email">メールアドレス:</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="password">パスワード:</label>
                <input type="password" id="password" name="password" required>
                <div class="guidance-message" id="password-guidance" style="display: none;">
                  * パスワードは8文字以上で、大文字、小文字、数字を含める必要があります
                </div>
              </div>                    
            <div class="form-group">
                <label for="confirmPassword">パスワードの確認:</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
                <div id="password-error" class="error-message">パスワードが一致しません</div>
                <div class="show-password">
                    <input type="checkbox" id="togglePassword">
                    <label for="togglePassword">パスワードを表示</label>
                </div>
            </div>
            <!-- reCAPTCHA widget with callbacks -->
            <div class="g-recaptcha"
                data-sitekey="6LfHvNcqAAAAAAP_74O2VL_OPgkHe-9tnf4Dkr7O"
                data-callback="enableRegisterButton"
                data-expired-callback="disableRegisterButton"></div>
            <br/>
            <button type="submit" id="register-button" disabled>登録</button>
        </form>
        <p>すでにアカウントをお持ちですか？<a href="login.html">ログイン</a></p>
    </div>
    <script>
        // Callback for enabling the register button when captcha is solved
        function enableRegisterButton(token) {
            document.getElementById('register-button').disabled = false;
        }
        
        // Callback to disable the register button if captcha expires
        function disableRegisterButton() {
            document.getElementById('register-button').disabled = true;
        }
        document.getElementById('togglePassword').addEventListener('change', function() {
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const type = this.checked ? 'text' : 'password';
            passwordInput.type = type;
            confirmPasswordInput.type = type;
        });

        // check if the password is legal
        const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[A-Za-z\d]{8,}$/;

        function validatePasswords() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorElement = document.getElementById('password-error');
            
            // Check if password meets legal criteria
            const legalPassword = passwordRegex.test(password);
            // Check if confirmation matches password
            const passwordsMatch = password === confirmPassword;
            
            if (!legalPassword) {
                errorElement.textContent = "* パスワードは少なくとも8文字以上で、大文字、小文字、数字を含める必要があります。";
                errorElement.style.display = 'block';
                return false;
            } else if (confirmPassword && !passwordsMatch) {
                errorElement.textContent = "* パスワードが一致しません。";
                errorElement.style.display = 'block';
                return false;
            } else {
                errorElement.style.display = 'none';
                return true;
            }
        }
        document.getElementById('confirmPassword').addEventListener('input', validatePasswords);
        document.getElementById('password').addEventListener('input', validatePasswords);

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const first_name = document.getElementById('first_name').value.trim();
            const last_name = document.getElementById('last_name').value.trim();
            const date_of_birth = document.getElementById('dob').value.trim();
            const country = document.getElementById('country').value.trim();
            const address = document.getElementById('address').value.trim();
            const gender = document.getElementById('gender').value.trim();

            // verify passwords match
            if (!validatePasswords()) {
                alert("パスワードを指定の要件に従って設定してください。");
                return;
            }

            // verify if all fields are filled
            if (!username || !email || !password || !first_name || !last_name || !date_of_birth || !country || !address || !gender) {
                alert("すべての項目を入力してください。");
                return;
            }

            // Retrieve the reCAPTCHA response generated by the widget
            const recaptchaResponse = document.querySelector('.g-recaptcha-response').value;
            if (!recaptchaResponse) {
                alert("あなたがロボットでないことを確認してください。");
                return;
            }

            const response = await fetch('/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password, first_name, last_name, date_of_birth, country, address, gender, recaptcha_token: recaptchaResponse })
            });

            if (response.ok) {
                alert('アカウントを確認するために、メールをご確認ください。');
                window.location.href = 'login.html';
            } else {
                const errorData = await response.json();
                alert(`Registration failed: ${errorData.detail || 'Try again.'}`);
                grecaptcha.reset();
                disableRegisterButton();
            }
        });

        const countries = [
            { code: 'AF', name: 'Afghanistan' },

        const countrySelect = document.getElementById("country");
        countries.forEach(country => {
            const option = document.createElement("option");
            option.value = country.code;
            option.textContent = country.name;
            countrySelect.appendChild(option);
        });
        countrySelect.value = "JP";

    </script>
</body>
</html>
