<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
        /* 全局样式 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        /* 页面背景 */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to right, #b3b8b3, #8f9692);
        }

        /* 容器 */
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        /* 表单组 */
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            transition: border-color 0.3s;
        }

        /* 输入框聚焦样式 */
        .form-group input:focus {
            border-color: #4CAF50;
            outline: none;
        }

        /* 按钮 */
        button {
            width: 100%;
            padding: 10px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:disabled {
            background: #ccc; /* grey background */
            cursor: not-allowed;
        }

        button:hover {
            background: #45a049;
        }
        .show-password {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
        }

        .show-password input {
            width: auto; 
            margin: 0;
            vertical-align: middle;
        }

        .show-password label {
            white-space: nowrap;
            vertical-align: middle;
            margin: 0;
        }
        .error-message {
            color: #f44336;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        /* 链接 */
        p {
            margin-top: 10px;
            font-size: 14px;
        }

        p a {
            color: #4CAF50;
            text-decoration: none;
        }

        p a:hover {
            text-decoration: underline;
        }

        /* 响应式设计 */
        @media screen and (max-width: 500px) {
            .container {
                width: 90%;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Create an Account</h2>
        <form id="registerForm">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password:</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
                <div id="password-error" class="error-message">Passwords do not match</div>
                <div class="show-password">
                    <input type="checkbox" id="togglePassword">
                    <label for="togglePassword">Show Password</label>
                </div>
            </div>
            <!-- reCAPTCHA widget with callbacks -->
            <div class="g-recaptcha"
                data-sitekey="6LfHvNcqAAAAAAP_74O2VL_OPgkHe-9tnf4Dkr7O"
                data-callback="enableRegisterButton"
                data-expired-callback="disableRegisterButton"></div>
            <br/>
            <button type="submit" id="register-button" disabled>Register</button>
        </form>
        <p>Already have an account? <a href="login.html">Login</a></p>
    </div>
    <script>
        // Callback for enabling the register button when captcha is solved
        function enableRegisterButton(token) {
            document.getElementById('register-button').disabled = false;
        }
        
        // Callback to disable the register button if captcha expires
        function disableRegisterButton() {
            document.getElementById('register-button').disabled = true;
        }
        document.getElementById('togglePassword').addEventListener('change', function() {
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const type = this.checked ? 'text' : 'password';
            passwordInput.type = type;
            confirmPasswordInput.type = type;
        });

        document.getElementById('confirmPassword').addEventListener('input', validatePasswords);
        document.getElementById('password').addEventListener('input', validatePasswords);

        function validatePasswords() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorElement = document.getElementById('password-error');
            
            if (confirmPassword && password !== confirmPassword) {
                errorElement.style.display = 'block';
                return false;
            } else {
                errorElement.style.display = 'none';
                return true;
            }
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            // verify passwords match
            if (!validatePasswords()) {
                alert("Passwords do not match!");
                return;
            }

            // verify if all fields are filled
            if (!username || !email || !password) {
                alert("Please fill in all fields.");
                return;
            }

            // Retrieve the reCAPTCHA response generated by the widget
            const recaptchaResponse = document.querySelector('.g-recaptcha-response').value;
            if (!recaptchaResponse) {
                alert("Please verify that you are not a robot.");
                return;
            }

            const response = await fetch('/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password, recaptcha_token: recaptchaResponse })
            });

            if (response.ok) {
                alert('Registration successful! Please login.');
                window.location.href = 'login.html';
            } else {
                const errorData = await response.json();
                alert(`Registration failed: ${errorData.detail || 'Try again.'}`);
                grecaptcha.reset();
                disableRegisterButton();
            }
        });
    </script>
</body>
</html>
